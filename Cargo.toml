[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-render",
    "crates/engine-assets",
    "crates/engine-cli",
    "crates/engine-editor",
    "crates/engine-physics",
    "crates/engine-script",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
engine-core = { path = "crates/engine-core" }
engine-render = { path = "crates/engine-render" }
engine-assets = { path = "crates/engine-assets" }
engine-editor = { path = "crates/engine-editor" }
engine-physics = { path = "crates/engine-physics" }
engine-script = { path = "crates/engine-script" }

wgpu = "30"
# 0.31 is still beta; stay on the stable line for the foundation.
winit = "0.30"
glam = { version = "0.33", features = ["serde"] }
hecs = "0.11"
# Pinned exactly (physics-design.md §3): rapier upgrades can change
# trajectories without API breaks; a golden-trace diff on upgrade is a
# breaking change to review, never noise to regenerate blindly.
rapier3d = { version = "=0.34.0", features = ["enhanced-determinism"] }
# Pinned exactly (scripting-design.md §1): the script API surface is a
# contract, and interpreter behavior rides in golden traces.
rhai = "=1.25.1"
gltf = { version = "1.4", default-features = false, features = ["import", "utils"] }
schemars = "1.2"
pollster = "1.0"
# Pinned to an egui master commit: the released 0.35 line pairs with wgpu 29,
# while this workspace is on wgpu 30; master supports wgpu 30 + winit 0.30.
# Swap to the 0.36 release when it ships. Settled with the user for M7.
eframe = { git = "https://github.com/emilk/egui", rev = "e6eb00a31c7089d4458c55fcbe5f1253311a7176", default-features = false, features = ["wgpu", "default_fonts"] }
egui = { git = "https://github.com/emilk/egui", rev = "e6eb00a31c7089d4458c55fcbe5f1253311a7176" }
egui-wgpu = { git = "https://github.com/emilk/egui", rev = "e6eb00a31c7089d4458c55fcbe5f1253311a7176" }
egui_kittest = { git = "https://github.com/emilk/egui", rev = "e6eb00a31c7089d4458c55fcbe5f1253311a7176", features = ["wgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
# wgpu and its shader-compiler dependencies are painfully slow unoptimized,
# and they are almost never the code under debug. Optimize deps, not us.
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
