# The check a contributor's change has to pass.
#
# `cargo test --workspace` is the real check, not `cargo build`: the render
# tests draw offscreen and assert on pixel values. On a CI runner with no
# usable GPU adapter they skip cleanly rather than fail, so what this job
# actually proves is that everything GPU-free — validation, physics, the
# geometry generators, the formatter, the CLI contract — still holds. Renders
# are verified locally against baselines, which are per-adapter artifacts and
# cannot be pinned from here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The gate.
      - run: cargo test --workspace --locked

      # Blocking since the M31 audit: the workspace is rustfmt-clean, so the
      # wide reformat-every-crate diff this used to defer has already been
      # paid. A formatting regression is now a red build.
      - run: cargo fmt --all -- --check

      # Blocking too, as of the commit that cleared the last 28 warnings. That
      # change was gated behind an A/B between binaries, since several of the
      # fixes were in geometry and validation code: 34 of 36 render artifacts
      # byte-identical, and the two that differed are the tour frames this
      # adapter cannot render reproducibly at all (both binaries disagree with
      # themselves on them — see CLAUDE.md §Verification).
      #
      # Some warnings here are silenced with a local `#[allow]` and a written
      # reason rather than "fixed", because the lint is wrong about them: the
      # `!(a > b)` comparisons in validation are negated precisely so NaN
      # fails, and `a <= b` would let it through. Read the comment before
      # deleting an allow.
      #
      # Note this step has to *compile*, not merely warn: `approx_constant` and
      # friends are deny-by-default, so a single one aborts the run for the
      # whole crate and every later lint in it goes unreported. That happened
      # once, and `continue-on-error` hid it for the length of a milestone.
      - run: cargo clippy --workspace --all-targets
