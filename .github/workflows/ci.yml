# The check a contributor's change has to pass.
#
# `cargo test --workspace` is the real check, not `cargo build`: the render
# tests draw offscreen and assert on pixel values. On a CI runner with no
# usable GPU adapter they skip cleanly rather than fail, so what this job
# actually proves is that everything GPU-free — validation, physics, the
# geometry generators, the formatter, the CLI contract — still holds. Renders
# are verified locally against baselines, which are per-adapter artifacts and
# cannot be pinned from here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The gate.
      - run: cargo test --workspace --locked

      # Blocking since the M31 audit: the workspace is rustfmt-clean, so the
      # wide reformat-every-crate diff this used to defer has already been
      # paid. A formatting regression is now a red build.
      - run: cargo fmt --all -- --check

      # Still advisory. 28 clippy warnings remain, and clearing them touches
      # geometry and validation code — exactly the kind of change this repo's
      # ULP-sensitive paths want gated behind an A/B between binaries rather
      # than swept in under a lint fix. Make this blocking on the commit that
      # actually clears them, not before.
      #
      # Note it does have to *compile*: `approx_constant` and friends are
      # deny-by-default, so a single one aborts the run for the whole crate
      # and every later lint in it goes unreported. That happened once and
      # `continue-on-error` hid it for the length of a milestone.
      - run: cargo clippy --workspace --all-targets
        continue-on-error: true
