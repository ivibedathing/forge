# Prebuilt `engine` binaries, so installing does not mean installing Rust.
#
# Tag a release and push it:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Each runner builds natively for its own target — no cross toolchains, at the
# cost of one runner per platform. The archives are named for the target triple
# because install.sh derives the name from `uname`, and SHA256SUMS lets that
# script verify what it downloaded.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      # winit and eframe link against X11, Wayland and GL on Linux. The
      # released binary's glibc floor is this runner's, which is why it is
      # pinned to the oldest supported Ubuntu rather than ubuntu-latest.
      - name: Linux windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # --locked: the lockfile pins the egui master rev the workspace depends
      # on, and a release must build what was tested, not what resolved today.
      - name: Build
        run: cargo build --release --locked -p engine-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="engine-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/engine" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # Checksummed from inside dist/, so the recorded name is the bare
          # archive name that install.sh looks up — not a build-host path.
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          name="engine-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/engine.exe" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          (cd dist && 7z a "$name.zip" "$name" >/dev/null)
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS && rm dist/*.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
